<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ermias Woretaw | Official Page</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0f19;
            color: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }
        .container {
            max-width: 480px;
            width: 100%;
        }
        .card {
            background: #111827;
            padding: 32px 24px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            border: 1px solid #1f2937;
            text-align: center;
        }
        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #38bdf8;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 2rem;
            color: #38bdf8;
            margin-bottom: 8px;
        }
        p.subtitle {
            color: #9ca3af;
            font-size: 1rem;
            margin-bottom: 20px;
            font-weight: 500;
        }
        .bio {
            line-height: 1.5;
            color: #d1d5db;
            margin-bottom: 24px;
            font-size: 0.95rem;
            text-align: left;
            background: #1f2937;
            padding: 14px;
            border-radius: 10px;
        }
        h2.section-title {
            font-size: 1.1rem;
            color: #38bdf8;
            margin-bottom: 12px;
            text-align: left;
            border-bottom: 1px solid #374151;
            padding-bottom: 4px;
        }
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }
        .btn {
            display: block;
            background-color: #38bdf8;
            color: #0b0f19;
            padding: 12px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: background-color 0.2s;
            text-align: center;
        }
        .btn:hover {
            background-color: #0ea5e9;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <!-- Replace profile.jpg with your exact uploaded image file name if different -->
            <img src="profile.jpg" alt="Ermias Woretaw" class="profile-img">
            
            <h1>Ermias Woretaw</h1>
            <p class="subtitle">Student Council President & Tech Enthusiast</p>
            
            <div class="bio">
                <p>Welcome to my official page! Passionate about technology, mechanical engineering, and hands-on projects.</p>
            </div>

            <h2 class="section-title">Connect With Me</h2>
            <div class="button-group">
                <a href="https://t.me/lost2me" target="_blank" class="btn">Telegram (@lost2me)</a>
                <a href="https://github.com/ermigame23-maker" target="_blank" class="btn">GitHub</a>
                <a href="mailto:ermigame23@gmail.com" class="btn">Email Me</a>
            </div>
        </div>
    </div>

</body>
</html>
