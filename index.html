<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ermias Woretaw | Portfolio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #1e293b;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-width: 500px;
            width: 100%;
            text-align: center;
            border: 1px solid #334155;
        }
        h1 {
            font-size: 2.2rem;
            color: #38bdf8;
            margin-bottom: 10px;
        }
        p.subtitle {
            color: #94a3b8;
            font-size: 1.1rem;
            margin-bottom: 24px;
        }
        .bio {
            line-height: 1.6;
            color: #cbd5e1;
            margin-bottom: 30px;
            text-align: left;
        }
        .btn {
            display: inline-block;
            background-color: #38bdf8;
            color: #0f172a;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn:hover {
            background-color: #0284c7;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Ermias Woretaw</h1>
        <p class="subtitle">Student & Tech Enthusiast</p>
        
        <div class="bio">
            <p>Welcome to my official page! I am passionate about technology, engineering, and hands-on projects.</p>
        </div>

        <a href="mailto:your-email@example.com" class="btn">Get in Touch</a>
    </div>

</body>
</html>
